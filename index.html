function saveTo(slot){try{localStorage.setItem(SAVEK+slot,JSON.stringify(statePack()));return true;}catch(e){return false;}}
function hasSave(slot){try{return!!localStorage.getItem(SAVEK+slot);}catch(e){return false;}}
function loadFrom(slot){let d=null;try{d=JSON.parse(localStorage.getItem(SAVEK+slot));}catch(e){}
 if(!d||d.v!==1)return false;
 S.lang=d.lang||'ja';S.sound=d.sound!==false;S.scene=d.scene||'bed';S.inv=d.inv||[];S.flags=d.flags||{};
 S.san=Math.max(35,d.san||100);S.clock=Math.min(d.clock||60,350);S.tideN=d.tideN||0;return true;}
function wipe(){try{Object.keys(localStorage).filter(k=>k.indexOf(SAVEK)===0).forEach(k=>localStorage.removeItem(k));}catch(e){}}

 const o=A.createOscillator(),g=A.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(24,f+slide),t+dur);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.001,vol||0.2),t+0.02);
 g.gain.exponentialRampToValueAtTime(0.0001,t+dur);

   ctx.lineTo(x+Math.cos(a)*s*0.45,y+s*0.12+Math.sin(a)*s*0.45);ctx.stroke();}}
 ctx.restore();}
function wrap(txt,mw){const ja=S.lang==='ja';const toks=ja?Array.from(txt):txt.split(' ');
 const out=[];let cur='';
 for(let i=0;i<toks.length;i++){const w2=ja?toks[i]:toks[i];
  const trial=cur?(ja?cur+w2:cur+' '+w2):w2;
  if(ctx.measureText(trial).width>mw&&cur){out.push(cur);cur=w2;}else cur=trial;}
 if(cur)out.push(cur);return out;}
function txt(t,x,y,mw,al,size,col,lh){const f=size||20;ctx.font=f+'px '+FONT;ctx.fillStyle=col||'#cfd8dd';
 const lines=wrap(t,mw||900);let yy=y;for(let i=0;i<lines.length;i++){
  let lx=x;if(al==='c')lx=x-ctx.measureText(lines[i]).width/2;else if(al==='r')lx=x-ctx.measureText(lines[i]).width;
  ctx.fillText(lines[i],lx,yy);yy+=lh||(f+9);}return yy;}

function lightStove(it){
 if(it==='match'){if(F('fire'))msg('stove_warm');else{setF('fire');msg('stove_lit');sfxFire();}}
 else if(it==='lantern'){
  if(!F('fire')){msg('stove_ex');return;}
  if(!F('oiled')){
   if(!has('oil')){msg('oil_needed');return;}
   take('oil');setF('oiled');msg('used_oil');}
  if(F('lit'))msg('oil_full');else{setF('lit');msg('lantern_lit');sfxFire();sfxGood();}
 } else msg(F('fire')?'stove_lit_ex':'stove_ex');}
function seqPick(key,expect,num,msgMark,msgWrong,sanHit,doneFn){
 const i=R.pil.length;
 if(expect[i]===key){R.pil.push(key);msg(msgMark,num);sfxStone();
  if(R.pil.length===expect.length){doneFn();}}
 else{R.pil=[];msg(msgWrong);san(sanHit);sfxBad();}}

function ACT_brazier(i,num){if(F('bra')){msg('brazier_ok');return;}
 const idx=R.bra.length;const expect=[1,2,0];
 if(expect[idx]===i){R.bra.push(i);msg('brazier_mark',num);sfxStone();

 else{R.bra=[];msg('brazier_wrong');san(-4);sfxBad();shake(8);}}

 if(F('cave'))return 'hint_s9';
 if(S.scene==='cave'||(S.scene==='tmpl'&&!F('bra')))return 'hint_s8';
 if(F('pad')||has('patch')||has('jerry')||S.scene==='flat'||S.scene==='dock'||S.scene==='boat')return 'hint_s7';

 case 'alm':ctx.fillStyle='#2c5640';rr(-12*u,-14*u,24*u,28*u);ctx.fillStyle='#d8cfae';rr(-9*u,-11*u,19*u,22*u);

 case 'photo':ctx.fillStyle='#dcdcd2';rr(-12*u,-13*u,24*u,26*u);ctx.fillStyle='#3a4a52';rr(-9*u,-10*u,18*u,16*u);

function canvasXY(e){const r=cv.getBoundingClientRect();
 return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function hit(list,x,y){for(let i=list.length-1;i>=0;i--){const b=list[i];
 if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return b;}return null;}
function inSceneSpots(x,y){if(!SC[S.scene])return null;

 else R.hover=hit(BTNS,p.x,p.y)||inSceneSpots(p.x,p.y);});
cv.addEventListener('pointerdown',e=>{e.preventDefault();
 if(e.button===2)return;
 initAudio();

 const p=canvasXY(e);R.mx=p.x;R.my=p.y;sfxClick();

   SC.bed.enter();saveTo('auto');}
  else if(b.k==='cont'){if(loadFrom('auto')){R.mode='play';R.msgs=[];R.cur=null;R.pop=null;R.endId=null;R.fade=0.9;}}

   if(loadFrom(sl)){R.mode='play';R.msgs=[];R.cur=null;R.pop=null;R.endId=null;R.fade=0.9;msg('sv_loaded');}}
  else if(b.k==='sound'){S.sound=!S.sound;setSound(S.sound);}
  else if(b.k==='lang'){S.lang=S.lang==='ja'?'en':'ja';savePrefs();}
  return;}
 if(R.mode==='end'){if(R.endT>1.2){R.mode='title';R.endId=null;R.msgs=[];R.cur=null;}return;}

 R.lightX=p.x;R.lightY=Math.min(p.y,SCENE_H-20);
 if(R.cur&&R.shown<R.cur.length){R.shown=R.cur.length;return;}
 else if(R.cur){R.cur=null;}

 if(!R.cur&&R.msgs.length){R.cur=String(R.msgs.shift());R.shown=0;}
